<svg xmlns="http://www.w3.org/2000/svg" width="800" height="244" viewBox="0 0 800 244" role="img" aria-labelledby="title desc">
<title id="title">额度焦虑小剧场</title><desc id="desc">左边的小团子反复想查额度，右边的小团子看了一眼余量后安心继续工作。</desc>
<rect width="800" height="244" rx="20" fill="#f6faf7"/>
<path d="M400 24v196" stroke="#dbe5df"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#344c40" text-anchor="middle">
<text x="200" y="38" font-size="13" fill="#667b6e">以前 · 每隔五分钟</text>
<text x="600" y="38" font-size="13" fill="#667b6e">现在 · 瞄一眼就好</text>
<path d="M139 145c-15-46 10-72 61-72s76 26 61 72c-10 32-112 32-122 0" fill="#f4eddf" stroke="#bcb39f" stroke-width="2"/>
<path d="M171 104l14 5m29 0 14-5" stroke="#665b49" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="182" cy="122" rx="3" ry="5" fill="#665b49"/><ellipse cx="218" cy="122" rx="3" ry="5" fill="#665b49"/>
<path d="M192 145q8-9 16 0" fill="none" stroke="#665b49" stroke-width="2"/>
<path d="M267 86q8 12 0 14q-8-2 0-14" fill="#b4d8e7"/>
<text x="200" y="202" font-size="18">“我是不是又快用完了？”</text>
<path d="M539 145c-15-46 10-72 61-72s76 26 61 72c-10 32-112 32-122 0" fill="#e5f0e8" stroke="#83ac96" stroke-width="2"/>
<path d="M574 119q8-10 16 0m20 0q8-10 16 0m-37 19q11 15 22 0" fill="none" stroke="#466b56" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="568" cy="134" r="6" fill="#d5b6ac" opacity=".6"/><circle cx="632" cy="134" r="6" fill="#d5b6ac" opacity=".6"/>
<path d="M675 85v18m-9-9h18" stroke="#83ac96" stroke-width="2.5" stroke-linecap="round"/>
<text x="600" y="202" font-size="18">“还有余量，继续写。”</text>
